package com.example.covid19tracker.controller;

import com.example.covid19tracker.model.CovidSummary;
import com.example.covid19tracker.service.CovidDataService;
import org.springframework.stereotype.Controller;
import org.springframework.ui.Model;
import org.springframework.web.bind.annotation.GetMapping;
import org.springframework.web.bind.annotation.ResponseBody;

@Controller
public class CovidController {

    private final CovidDataService covidDataService;

    public CovidController(CovidDataService covidDataService) {
        this.covidDataService = covidDataService;
    }

    @GetMapping("/")
    public String home(Model model) {
        model.addAttribute("stats", covidDataService.getGlobalStats());
        return "index";
    }

    @GetMapping("/api/covid/global")
    @ResponseBody
    public CovidSummary getGlobalStats() {
        return covidDataService.getGlobalStats();
    }
}
